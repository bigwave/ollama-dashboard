services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_PORT=11434
      - FLASK_APP=OllamaDashboard.py
      - AUTO_START_OLLAMA=${AUTO_START_OLLAMA}
      - LOG_LEVEL=${LOG_LEVEL}
      - OLLAMA_DASHBOARD_CONFIG=${OLLAMA_DASHBOARD_CONFIG}

    volumes:
      - ../data:/app/data
      - ../app/static:/app/app/static:ro
      - ../app/templates:/app/app/templates:ro

